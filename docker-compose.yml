services:
  notediscovery:
    build: .
    container_name: notediscovery
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      # Required: Your notes
      - ./data:/app/data
      # Optional: Uncomment to customize (file/folder must exist with content!)
      # - ./config.yaml:/app/config.yaml
      # - ./themes:/app/themes
      # - ./plugins:/app/plugins
      # - ./locales:/app/locales
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: ${PORT:-8000}
      TZ: ${TZ:-UTC}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://localhost:{os.getenv(\"PORT\", \"8000\")}/health')"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 15s
